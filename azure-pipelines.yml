
# Ejecuta el pipeline cuando se realizan cambios en main.
trigger:
  branches:
    include:
      - main

# Utiliza un agente Linux administrado por Azure Pipelines.
pool:
  vmImage: ubuntu-latest

steps:
  # Descarga el código del repositorio en el agente.
  - checkout: self

  # Instala y agrega Node.js 22 al PATH del agente.
  - task: UseNode@1
    displayName: 'Install Node.js 22'
    inputs:
      versionSource: 'spec'
      version: '22.x'
      checkLatest: false

  # Comprueba qué versiones quedaron disponibles en el agente.
  - script: |
      node --version
      npm --version
    displayName: 'Verify Node.js installation'

  # Instala las dependencias usando el lockfile.
  - script: npm ci
    displayName: 'Install dependencies'
    workingDirectory: '$(Build.SourcesDirectory)/app'

  # Ejecuta las pruebas automatizadas.
  - script: npm test
    displayName: 'Run application tests'
    workingDirectory: '$(Build.SourcesDirectory)/app'

 # Construye la imagen Docker y la publica en Azure Container Registry.
  - task: Docker@2
    displayName: 'Build and push Docker image'
    inputs:
      command: 'buildAndPush'
      repository: 'k8s-api-demo'
      dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      buildContext: '$(Build.SourcesDirectory)'
      containerRegistry: 'SC-ACR-DEV'
      tags: |
        $(Build.BuildId)
        latest

  # Despliega en Azure App Service la imagen recién publicada.
  - task: AzureWebAppContainer@1
    displayName: 'Deploy to Azure App Service'
    inputs:
      azureSubscription: 'SC-APP-SERVICE-DEV'
      appName: 'k8s-api-demo-rodrigo'
      containers: 'rodrigodevopsregistry.azurecr.io/k8s-api-demo:$(Build.BuildId)'
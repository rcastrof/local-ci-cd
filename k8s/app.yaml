
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-api-demo
  namespace: rodrigo-castro-test-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-api-demo
  template:
    metadata:
      labels:
        app: k8s-api-demo
    spec:
      containers:
        - name: api
          image: rodrigo101998/k8s-api-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-api-demo
  namespace: rodrigo-castro-test-2
spec:
  type: ClusterIP
  selector:
    app: k8s-api-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
